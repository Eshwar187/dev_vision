# ==============================================================================
# DevVision AI — Production Compose Architecture (100% Self-Hosted RAG)
# ==============================================================================
version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devvision_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devvision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-devvision}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devvision} -d ${POSTGRES_DB:-devvision}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          cpus: "1.0"
          memory: 2G
    networks:
      - devvision_internal

  redis:
    image: redis:7-alpine
    container_name: devvision_redis_prod
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}"]
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks:
      - devvision_internal

  minio:
    image: minio/minio:latest
    container_name: devvision_minio_prod
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    volumes:
      - minio_prod_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
    networks:
      - devvision_internal

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: devvision_backend_prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-devvision}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-devvision}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-devvision-documents}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_SECURE=false
      - LLM_BACKEND=${LLM_BACKEND:-ollama}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:11434}
      - LLM_MODEL=${LLM_MODEL:-qwen2.5-coder:7b-instruct-q4_K_M}
      - RAG_QUERY_TIMEOUT_SECONDS=60
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_RAG_QUERIES_PER_MINUTE=30
      - RATE_LIMIT_UPLOADS_PER_MINUTE=10
      - RATE_LIMIT_REINDEX_PER_MINUTE=5
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          cpus: "1.0"
          memory: 2G
    networks:
      - devvision_internal

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: devvision_worker_prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-devvision}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-devvision}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-devvision-documents}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_SECURE=false
      - EMBEDDING_MODEL_NAME=BAAI/bge-small-en-v1.5
      - RERANKER_MODEL_NAME=BAAI/bge-reranker-base
      - RERANKER_ENABLED=true
      - RAG_PROCESSING_LEASE_SECONDS=60
      - RAG_PROCESSING_HEARTBEAT_SECONDS=15
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          cpus: "1.0"
          memory: 2G
    networks:
      - devvision_internal

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: devvision_frontend_prod
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - ORIGIN=http://localhost:3000
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    networks:
      - devvision_internal

networks:
  devvision_internal:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  minio_prod_data:
