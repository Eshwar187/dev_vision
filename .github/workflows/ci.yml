name: DevVision AI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-and-postgres-tests:
    name: Backend Pytest & Real PostgreSQL (pgvector)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: devvision_test
          POSTGRES_PASSWORD: devvision_test_password
          POSTGRES_DB: devvision_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio anyio httpx

      - name: Run Alembic migrations against Real PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://devvision_test:devvision_test_password@localhost:5432/devvision_test_db
          WORKER_DATABASE_URL: postgresql+asyncpg://devvision_test:devvision_test_password@localhost:5432/devvision_test_db
        run: |
          alembic upgrade head

      - name: Execute Dedicated PostgreSQL + pgvector Integration Tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://devvision_test:devvision_test_password@localhost:5432/devvision_test_db
          DATABASE_URL: postgresql+asyncpg://devvision_test:devvision_test_password@localhost:5432/devvision_test_db
          WORKER_DATABASE_URL: postgresql+asyncpg://devvision_test:devvision_test_password@localhost:5432/devvision_test_db
        run: |
          # The -rs flag reports skip reasons. Ensure 0 tests are skipped!
          python -m pytest tests/integration/test_postgres_pgvector.py -v -rs --durations=10

      - name: Run Full Backend Test Suite
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://devvision_test:devvision_test_password@localhost:5432/devvision_test_db
          DATABASE_URL: postgresql+asyncpg://devvision_test:devvision_test_password@localhost:5432/devvision_test_db
          WORKER_DATABASE_URL: postgresql+asyncpg://devvision_test:devvision_test_password@localhost:5432/devvision_test_db
          REDIS_URL: redis://localhost:6379/0
        run: |
          python -m pytest tests/ -v

  frontend-checks:
    name: Frontend Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run svelte-check
        working-directory: frontend
        run: npm run check

      - name: Build frontend for production
        working-directory: frontend
        run: npm run build
