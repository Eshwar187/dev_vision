services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devvision_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devvision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devvision_password}
      POSTGRES_DB: ${POSTGRES_DB:-devvision}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devvision} -d ${POSTGRES_DB:-devvision}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - devvision_net

  redis:
    image: redis:7-alpine
    container_name: devvision_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - devvision_net

  minio:
    image: minio/minio:latest
    container_name: devvision_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - devvision_net

  minio-init:
    image: minio/mc:latest
    container_name: devvision_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set devvision_minio http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin}; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      /usr/bin/mc mb --ignore-existing devvision_minio/${S3_BUCKET_NAME:-devvision-local};
      /usr/bin/mc anonymous set none devvision_minio/${S3_BUCKET_NAME:-devvision-local};
      echo 'MinIO bucket initialized successfully.';
      exit 0;
      "
    networks:
      - devvision_net

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: devvision_backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-devvision}:${POSTGRES_PASSWORD:-devvision_password}@postgres:5432/${POSTGRES_DB:-devvision}
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-devvision-local}
      - S3_REGION=us-east-1
      - S3_SECURE=false
      - SECRET_KEY=${SECRET_KEY:-devvision_super_secret_dev_key_change_in_production_32chars_min}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - devvision_net

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: devvision_frontend
    restart: unless-stopped
    environment:
      - PUBLIC_API_BASE_URL=http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - devvision_net

networks:
  devvision_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
